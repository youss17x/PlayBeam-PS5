name: Build APK

# Manual builds only: Actions tab → Build APK → Run workflow
on:
  workflow_dispatch:

env:
  # pinned ps5-payload-dev/sdk commit
  PS5_SDK_REF: 8816aee4cd88fc47b07819d2b6f4769c095a074b

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- PS5 payload (PlayBeam Server) ----
      - name: Install PS5 payload SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          mkdir /tmp/ps5sdk-src && cd /tmp/ps5sdk-src
          git init -q
          git fetch -q --depth 1 https://github.com/ps5-payload-dev/sdk "$PS5_SDK_REF"
          git checkout -q FETCH_HEAD
          make -j4 DESTDIR="$HOME/ps5sdk" install

      - name: Build PlayBeam Server payload
        run: |
          make -C payload PS5_PAYLOAD_SDK="$HOME/ps5sdk"
          mkdir -p app/src/main/assets
          cp payload/playbeam-server.elf app/src/main/assets/

      - name: Build PlayBeam app for the PS5 home screen
        run: |
          git clone -q --depth 1 --branch v1.3.1 https://github.com/madler/zlib "$RUNNER_TEMP/zlib"
          PS5_PAYLOAD_SDK="$HOME/ps5sdk" ZLIB_SRC="$RUNNER_TEMP/zlib" launcher/build.sh
          cp launcher/out/playbeam-ps5-app.zip app/src/main/assets/

      # ---- Android app ----
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK is already installed on GitHub's ubuntu runners.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Signing key from the repository secrets (skipped if they aren't set yet)
      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/playbeam.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/playbeam.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets not set: the APK is signed with a temporary key"
          fi

      - name: Build debug APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/*.apk PlayBeam-PS5-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PlayBeam-PS5-test
          path: PlayBeam-PS5-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PlayBeam-Server-PS5-payload
          path: payload/playbeam-server.elf
